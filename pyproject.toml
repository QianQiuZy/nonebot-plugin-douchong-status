[project]
name = "nonebot-plugin-douchong-status"
version = "0.1.0"
description = "NoneBot2 VR、PSP、VUP 斗虫服务健康巡检与 QQ 私信告警"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "nonebot2>=2.3.3,<3",
    "nonebot-adapter-onebot>=2.4.5,<3",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = ["nonebot2[fastapi]>=2.3.3,<3", "pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
